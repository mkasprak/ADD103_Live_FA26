<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Tables</title>
</head>
<body>
       <!-- 🧱 Tables are made from rows and cells. -->
     <table>
          <!-- 🏷️ caption names the table for readers. -->
         <caption>Table Demo</caption>
          <!-- 🔝 th cells label each column. -->
         <tr>
            <th scope="col">col 1</th>
            <th scope="col">col 2</th>
            <th scope="col">col 3</th>
            <th scope="col">col 4</th>
            <th scope="col">col 5</th>
         </tr>
         <!-- 📏 colspan stretches a cell across several columns. -->
         <tr>
            <td>1</td>
            <td colspan="3">1</td>
            <td></td>
         </tr>
         <!-- 📐 rowspan stretches a cell across several rows. -->
         <tr>
            <td></td>
            <td>1</td>
            <td rowspan="2"></td>
            <td></td>
            <td></td>
         </tr>
         <tr>
            <td></td>
            <td>1</td>
          
            <td>1</td>
            <td></td>
         </tr>
         <tr>
            <td></td>
            <td>1</td>
            <td>1</td>
            <td></td>
            <td></td>
         </tr>
     </table>
</body>
</html>
