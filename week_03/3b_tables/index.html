<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Tables</title>
</head>
<body>
       <!-- 🧱 A table is built from rows (tr) and cells (th or td). -->
     <table>
          <!-- 🏷️ A caption names the table and improves context for readers. -->
         <caption>Table Demo</caption>
          <!-- 🔝 Header cells describe the columns; scope connects each header to its column. -->
         <tr>
            <th scope="col">col 1</th>
            <th scope="col">col 2</th>
            <th scope="col">col 3</th>
            <th scope="col">col 4</th>
            <th scope="col">col 5</th>
         </tr>
         <!-- 📏 colspan makes this cell span three columns. -->
         <tr>
            <td>1</td>
            <td colspan="3">1</td>
            <td></td>
         </tr>
         <!-- 📐 rowspan makes this cell span two rows. -->
         <tr>
            <td></td>
            <td>1</td>
            <td rowspan="2"></td>
            <td></td>
            <td></td>
         </tr>
         <tr>
            <td></td>
            <td>1</td>
          
            <td>1</td>
            <td></td>
         </tr>
         <tr>
            <td></td>
            <td>1</td>
            <td>1</td>
            <td></td>
            <td></td>
         </tr>
     </table>
</body>
</html>
