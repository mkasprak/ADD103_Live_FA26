<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Tables</title>
</head>
<body>
    <!-- 🕸️  (tr>td*5)*5 -->
     <table>
        <!-- 👨‍🦽‍➡️needs a caption -->
         <caption>Table Demo</caption>
         <tr>
            <th scope="col">col 1</th>
            <th scope="col">col 2</th>
            <th scope="col">col 3</th>
            <th scope="col">col 4</th>
            <th scope="col">col 5</th>
         </tr>
         <tr>
            <td>1</td>
            <td colspan = 3>1</td>
            <td></td>
         </tr>
         <tr>
            <td></td>
            <td>1</td>
            <td rowspan = 2></td>
            <td></td>
            <td></td>
         </tr>
         <tr>
            <td></td>
            <td>1</td>
          
            <td>1</td>
            <td></td>
         </tr>
         <tr>
            <td></td>
            <td>1</td>
            <td>1</td>
            <td></td>
            <td></td>
         </tr>
     </table>
</body>
</html>
