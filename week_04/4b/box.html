<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        .border-box{
            box-sizing: border-box;
            width:200px;
            height: 200px;
            background-color:black;
            padding: 10px;
            border: 2px solid gold;
            color: white;
            margin: 20px auto;
        }

        .normal{
            width:200px;
            height: 200px;
            background-color: aquamarine;
            padding: 10px;
            border: 2px solid gold;
            margin: 20px auto;
        }
    </style>
    <title>box styling</title>
</head>
<body>
    <div class="border-box">
        <h2>Border Box</h2>
    </div>
    <div class="normal">
        <h2>Normal</h2>
    </div>
    
</body>
</html>
