<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Flex practice</title>
</head>
<body>
    <!-- 🏷️ This heading introduces the flexbox practice page. -->
    <h1>Create a Flex Container</h1>

<!-- 📦 .flexbox-container is the flex parent. Its children become flex items. -->
<div class="flexbox-container">
  <!-- 📇 Each card is a flex item and a reusable content block. -->
  <div class = "card">
    <!-- 📝 The heading labels each card clearly. -->
    <h2>Mornings!</h2>
    <!-- 🖼️ Images need alt text for accessibility. -->
    <img src="images/puppy.jpg" alt="Duck with puppy">
</div>
  <!-- 📇 This second card shows another flex item in the same row. -->
  <div class = "card"><h2>Afternoon!</h2>
    <img src="images/programming.jpg" alt="programming duck cartoon">
</div>
</div>

<!-- 🧩 A second flex container shows how we repeat the same layout pattern. -->
<div class="flexbox-container">
  <!-- 🔢 These cards help us practice spacing and alignment. -->
  <div class = "card">Item 1</div>
  <div class = "card">Item 2</div>
</div>
</body>
</html>
