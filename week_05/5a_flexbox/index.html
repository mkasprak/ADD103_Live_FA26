<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Flex practice</title>
</head>
<body>
    <!-- 🏷️ The main page title helps form the outline and structure of our document. -->
    <h1>Create a Flex Container</h1>

<!-- 📦 The flexbox container acts as a parent element. Its direct children become flex items! -->
<div class="flexbox-container">
  <!-- 📇 This is a card child element, which we style in CSS as a modular container. -->
  <div class = "card">
    <!-- 📝 Card headings should provide a clear and descriptive title. -->
    <h2>Mornings!</h2>
    <!-- 🖼️ Images need an alt attribute to ensure accessibility for screen readers. -->
    <img src="images/puppy.jpg" alt="Duck with puppy">
</div>
  <!-- 📇 Another card child, demonstrating how flex elements align side-by-side or wrap. -->
  <div class = "card"><h2>Afternoon!</h2>
    <img src="images/programming.jpg" alt="programming duck cartoon">
</div>
</div>

<!-- 🧩 We can use multiple flexbox container parents to partition different sections of the page. -->
<div class="flexbox-container">
  <!-- 🔢 Simple card placeholder items to demonstrate spacing properties like space-around. -->
  <div class = "card">Item 1</div>
  <div class = "card">Item 2</div>
</div>
</body>
</html>
