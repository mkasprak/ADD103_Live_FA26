<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grids</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 🏷️ This heading introduces the grid layout demonstration. -->
    <h1>Grid Layout</h1>

    <!-- 🧱 The container is the grid parent. Its child divs become grid items. -->
    <div class="container">
        <!-- 🏁 Header spans both columns across the top of the grid. -->
        <div class = "header"> <h2>Header</h2></div>

        <!-- 🧭 Menu occupies the narrower left column. -->
        <div class = "menu">
            <h3>Menu</h3>
            <a href="#">Link 1</a>
            <br>
            <a href="#">Link 2</a>
            <br>
            <a href="#">Link 3</a>
            <br>
        </div>

        <!-- 📝 Content occupies the wider right column. -->
        <div class="content">
            <h3>Content</h3>
            <p>Lorem, ipsum dolor sit amet consectetur adipisicing elit. Maiores voluptas animi quia nulla nihil mollitia at blanditiis possimus. Atque obcaecati consequuntur natus illo repudiandae voluptatum dolore nemo ipsa adipisci iste.</p>
        </div>

        <!-- 👣 Footer spans both columns across the bottom of the grid. -->
        <div class="footer">
            <h3>Footer</h3>
        </div>
    
    </div>
</body>
</html>
