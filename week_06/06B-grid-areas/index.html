<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Areas</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- 🧱 The container is a 4-column grid parent; each direct child is placed by grid-column span. -->
    <div class="container">
        <!-- 🏁 Header spans all 4 columns (grid-column: span 4) to stretch across the full page. -->
        <header class="card hero">

            <h1>Header</h1>
        </header>

        <!-- 🧭 Left aside spans just 1 of the 4 columns, forming the narrow sidebar. -->
        <aside class="card left-side">
            <h3>Left Aside</h3>
        </aside>

        <!-- 📝 Main spans the remaining 3 columns and is itself a nested grid for the image cards. -->
        <main class="card content">

            
            <!-- 🖼️ Each image-card spans 1 column of the nested 3-column grid inside main. -->
            <div class="card image-card"></div>
            <div class="card image-card"><h3>Main</h3></div>
            <div class="card image-card"></div>
            <div class="card image-card"></div>
            <div class="card image-card"></div>
            <div class="card image-card"></div>
        </main>

        <!-- 👣 Footer spans all 4 columns to close out the full-page layout. -->
        <footer class="card my_footer">
            <h3>Footer</h3>
        </footer>
    </div>
    
</body>
</html>
