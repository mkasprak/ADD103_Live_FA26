<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 7B Demo: The Responsive Photo Wall</title>
    
</head>
<body>

    <h1>The Responsive Photo Wall</h1>
    <p style="text-align: center; margin-bottom: 30px;">Resize your browser window to watch the layout adapt from 1 column up to 4 columns.</p>

    <div class="photo-grid">
        <div class="photo-card">
            <img src="https://picsum.photos/id/1015/400/300" alt="River landscape">
            <p>Mountain River</p>
        </div>
        <div class="photo-card">
            <img src="https://picsum.photos/id/1016/400/300" alt="Valley view">
            <p>Alpine Valley</p>
        </div>
        <div class="photo-card">
            <img src="https://picsum.photos/id/1018/400/300" alt="Forest peak">
            <p>Forest Ridge</p>
        </div>
        <div class="photo-card">
            <img src="https://picsum.photos/id/1025/400/300" alt="Couch puppy">
            <p>Restful Companion</p>
        </div>
    </div>

</body>
</html>
