<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">
    <title>Bootstrap</title>
</head>
<body>
    <!-- Standard Container -->
    <div class="container">
        <h1>Container</h1>
        <!-- One row with 4 equal columns -->
        <div class="row">
            <div class="col">
                <p>One</p>
            </div>
            <div class="col">
                <p>Two</p>
            </div>
            <div class="col">
                <p>Three</p>
            </div>
            <div class="col">
                <p>Four</p>
            </div>
        </div>
    </div>
    <!-- Full-width Container -->
    <div class="container-fluid">
        <h1>Container Fluid</h1>
        <!-- Row 1: 4 equal columns -->
        <div class="row">
            <div class="col">
                <p>One</p>
            </div>
            <div class="col">
                <p>Two</p>
            </div>
            <div class="col">
                <p>Three</p>
            </div>
            <div class="col">
                <p>Four</p>
            </div>
            
        </div>
         <!-- Row 2: 3 equal columns -->
         <div class="row">
            <div class="col">
                <p>One</p>
            </div>
            <div class="col">
                <p>Two</p>
            </div>
            <div class="col">
                <p>Three</p>
            </div>
            
        </div>
    </div>
</body>
</html>
