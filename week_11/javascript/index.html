<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JavaScript</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <h1>JavaScript Image Change</h1>
      <!--
        How this works:
        - On any image that has an `onclick` attribute, clicking it runs JavaScript.
        - We call `change(...)` (a function defined in `script.js`) and pass in the image file path.
        - That function finds the big image with `id="large"` and swaps its `src` to the path you clicked.
      -->
      <!-- (div>img)*5 -->
      <div class="grid-container">
        <div>
          <img
            src="images/duckbacca.png"
            alt="Duck Bacca"
            onclick="change('images/duckbacca.png')"
          />
        </div>
        <div>
          <img
            src="images/duckstar.png"
            alt="Duck Star"
            onclick="change('images/duckstar.png')"
          />
        </div>
        <div><img src="images/duckvader.png" alt="Duck Vader" /></div>
        <div><img src="images/leia.png" alt="Princess Leia as a duck" /></div>
        <div>
          <img src="images/wookieandrobot.png" alt="Wookie and Robot" />
        </div>
      </div>
      <div>
        <!-- The "target" image that JavaScript updates when you click a thumbnail -->
        <figure>
          <figcaption id="large-caption">Duckbacca</figcaption>
          <img src="images/duckbacca.png" id="large" />
        </figure>
      </div>
    </div>

    <!-- Load our JavaScript after the HTML so the elements above already exist in the page -->
    <script src="script.js"></script>
  </body>
</html>
